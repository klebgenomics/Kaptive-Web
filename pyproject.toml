[project]
name = "kaptive-web"
description = "Web interface for Kaptive, the tool for _in silico_ serotyping"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
dynamic = ["version"]
keywords = ["bioinformatics", "microbiology", "genomics", "serotyping"]
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = [
    "kaptive[plot,json]>=3.3.1",
    "fastapi[standard]",
    "uvicorn[standard]",
    "aiosqlite>=0.22.1",
    "pydantic-settings>=2.14.2",
    "authlib>=1.7.2",
    "httpx2>=2.5.0",
    "itsdangerous>=2.2.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
]

[dependency-groups]
test = ["pytest>=9.0.0", "pytest-cov"]
dev = [
    { include-group = "test" },
]

[project.urls]
Homepage = "https://kaptive-web.erc.monash.edu/"
Documentation = "https://klebgenomics.github.io/kaptive-web"
Repository = "https://github.com/klebgenomics/Kaptive-Web"
Issues = "https://github.com/klebgenomics/Kaptive-Web/issues"
Changelog = "https://github.com/klebgenomics/Kaptive-Web/blob/master/CHANGELOG.md"

[project.scripts]
# This creates a terminal command you can run anywhere after installing
kaptive-web = "kaptive_web.main:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kaptive_web/_version.py"

[tool.hatch.build.targets.wheel]
# This is the crucial part: it tells the builder to include your HTML/JS files
packages = ["src/kaptive_web"]
include = ["src/kaptive_web/frontend/**/*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ruff]
line-length = 120
exclude = [".agents", ".git", ".venv", "__pycache__", "src/kaptive_web/_version.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
