version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaptive-web

  kaptive-web:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/kaptive_web.db
    env_file:
      - .env
    volumes:
      - kaptive_data:/app/data

volumes:
  caddy_data:
  caddy_config:
  kaptive_data:
